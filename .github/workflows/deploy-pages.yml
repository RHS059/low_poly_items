name: Deploy 3D viewer to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - index.html
      - manifest.json
      - 'exports/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_run:
    workflows: ["Build and publish city assets"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare viewer and models
        run: |
          mkdir -p _site
          cp index.html manifest.json _site/
          cp -r exports _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
