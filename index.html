.lang{display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:12px;color:#aab2b2;cursor:pointer;width:max-content}.lang input{position:absolute;opacity:0;width:1px;height:1px;margin:0;padding:0}.slider{position:relative;width:36px;height:20px;border-radius:10px;background:#3a413e;border:1px solid #8d805f}.slider::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#f2dfb7;transition:transform .2s}.lang input:checked+.slider::after{transform:translateX(16px)}.lang input:focus-visible+.slider{outline:2px solid #d7bd87;outline-offset:2px}.lang:not(:has(input:checked)) .en,.lang:has(input:checked) .ja{color:#f2dfb7}

</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<div class="collection-tabs" role="tablist" aria-label="Model collection"><button id="tab-astra" role="tab" aria-selected="true" aria-controls="collection-panel" data-collection="astra">Astra XHigh</button><button id="tab-vs" role="tab" aria-selected="false" aria-controls="collection-panel" tabindex="-1" data-collection="vs">vs</button><button id="tab-argon" role="tab" aria-selected="false" aria-controls="collection-panel" tabindex="-1" data-collection="argon">Argon</button></div>
<aside><header><label class="lang"><span class="en">English</span><input type="checkbox" id="lang" role="switch" aria-label="日本語"><span class="slider"></span><span class="ja">日本語</span></label><h1 data-i18n="city">American City</h1><div class="sub" data-i18n="sub">Low-poly object collection</div><input id="search" type="search" placeholder="Search all objects…" aria-label="Search all objects" autocomplete="off"><div class="sub" id="count">Loading collection…</div></header><nav id="list" aria-label="Asset categories"></nav></aside>
<main id="collection-panel" role="tabpanel" aria-labelledby="tab-astra"><div id="viewport"></div><div class="top"><div><h2 id="title">Choose an object</h2><div id="meta"></div></div><div class="actions"><button id="reset" title="Frame the selected object" data-i18n="reset">Reset view</button><a id="download" hidden download data-i18n="download">Download GLB</a></div></div><div id="comparison" class="comparison"><div class="divider"></div><div class="pane-label"><strong>Astra XHigh</strong><small id="stats-astra"></small><a id="download-astra" hidden download data-i18n="download">Download GLB</a></div><div class="pane-label right"><strong>Argon</strong><small id="stats-argon"></small><a id="download-argon" hidden download data-i18n="download">Download GLB</a></div></div><div id="status" role="status" aria-live="polite">Loading 3D viewer…</div><div class="bottom"><span class="hint" data-i18n="hint">Drag to rotate · Right-drag to pan · Scroll to zoom</span><div class="pager"><button id="prev" aria-label="Previous object">←</button><span id="position"></span><button id="next" aria-label="Next object">→</button></div></div></main>
<script type="module">
const $=id=>document.getElementById(id);
const dims=a=>a.dimensions_m.map(n=>n.toFixed(2)).join(' × ');
const L={
en:{docTitle:'American City — 3D Asset Browser',city:'American City',sub:'Low-poly object collection',search:'Search all objects…',loadingCollection:'Loading collection…',reset:'Reset view',frameTitle:'Frame the selected object',download:'Download GLB',hint:'Drag to rotate · Right-drag to pan · Scroll to zoom',prev:'Previous object',next:'Next object',stats:a=>`${a.export_vertices.toLocaleString()} vertices · ${a.triangles.toLocaleString()} triangles · ${dims(a)} m`,matched:'Matched objects · Same scale · Synchronized controls',loadingObject:'Loading object…',objectFail:'Could not load this object. Select it again to retry.',count:(n,m)=>`${n.toLocaleString()} of ${m.toLocaleString()} objects`,empty:'No matching objects.',noneInCollection:'No matching objects in this collection.',collectionFail:c=>`Could not load ${c}. Select the tab to retry.`,unavailable:'Collection unavailable',startFail:'The viewer could not start. Check your internet connection and WebGL support, then reload.'},
ja:{docTitle:'アメリカの街 — 3Dアセットブラウザ',city:'アメリカの街',sub:'ローポリ・オブジェクト集',search:'すべてのオブジェクトを検索…',loadingCollection:'コレクションを読み込み中…',reset:'視点をリセット',frameTitle:'選択したオブジェクトに合わせる',download:'GLBをダウンロード',hint:'ドラッグで回転 · 右ドラッグで移動 · スクロールでズーム',prev:'前のオブジェクト',next:'次のオブジェクト',stats:a=>`頂点 ${a.export_vertices.toLocaleString()} · 三角形 ${a.triangles.toLocaleString()} · ${dims(a)} m`,matched:'対応オブジェクト · 同一スケール · 操作同期',loadingObject:'オブジェクトを読み込み中…',objectFail:'このオブジェクトを読み込めませんでした。もう一度選択して再試行してください。',count:(n,m)=>`${m.toLocaleString()}件中 ${n.toLocaleString()}件`,empty:'一致するオブジェクトはありません。',noneInCollection:'このコレクションに一致するオブジェクトはありません。',collectionFail:c=>`${c}を読み込めませんでした。タブを選択して再試行してください。`,unavailable:'コレクションを利用できません',startFail:'ビューアーを起動できませんでした。インターネット接続とWebGLの対応状況を確認してから再読み込みしてください。'}};
let lang='en',refreshList=()=>{};
const t=(k,...a)=>{const v=L[lang][k];return typeof v==='function'?v(...a):v;};
// Remember which message each element shows so a language switch can re-render it.
const texts=new Map();
function tx(id,key,...a){texts.set(id,[key,a]);$(id).textContent=t(key,...a);}
function raw(id,s){texts.delete(id);$(id).textContent=s;}
function applyLang(){document.documentElement.lang=lang;document.title=t('docTitle');for(const el of document.querySelectorAll('[data-i18n]'))el.textContent=t(el.dataset.i18n);$('search').placeholder=t('search');$('search').setAttribute('aria-label',t('search'));$('reset').title=t('frameTitle');$('prev').setAttribute('aria-label',t('prev'));$('next').setAttribute('aria-label',t('next'));for(const [id,[key,a]] of texts)$(id).textContent=t(key,...a);refreshList();}
$('lang').onchange=()=>{lang=$('lang').checked?'ja':'en';applyLang();};
try {
const THREE=await import('three');
const {OrbitControls}=await import('three/addons/controls/OrbitControls.js');
const {GLTFLoader}=await import('three/addons/loaders/GLTFLoader.js');
const base=location.protocol==='file:'?'https://raw.githubusercontent.com/RHS059/low_poly_items/main/':new URL('./',location.href).href;
const collections={astra:{label:'Astra XHigh',folder:''},vs:{label:'Astra XHigh vs Argon'},argon:{label:'Argon',folder:'argon/'}};
let activeCollection='astra',collectionSerial=0;
const manifests=new Map();
const categories=['Street furniture','Traffic & parking','Cars, bikes & motorcycles','Waste & cleaning','Utilities & HVAC','Tools','Construction','Plants & landscaping','Playgrounds & sports','Storefronts & food service','Yards & gardens','Building exteriors','Roads & transit','Mail & logistics','Commercial & emergency vehicles','Food, packaging & litter','Personal & recreation','Lighting & civic fixtures','Fences & gates','Waterfront, winter & events','Modular building kit'];
const label=a=>a.name.replace(/^b\d+_/,'').replaceAll('_',' ');
const categoriesJa=['街路設備','交通・駐車','車・自転車・バイク','ごみ・清掃','設備・空調','工具','建設','植物・造園','遊び場・スポーツ','店舗・飲食','庭・ガーデン','建物外装','道路・交通機関','郵便・物流','業務用・緊急車両','食品・包装・ごみ','個人・レジャー','照明・公共設備','フェンス・門','水辺・冬・イベント','モジュール建築キット'];
const groupName=g=>lang==='ja'&&categoriesJa[categories.indexOf(g)]||g;
const group=a=>categories[Number(a.name.slice(1,3))-1]||a.category;
const views=[0,1].map(()=>({scene:new THREE.Scene(),model:null,grid:null,ground:null}));
const camera=new THREE.PerspectiveCamera(38,1,.001,1000);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0,0);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
$('viewport').append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.49;
// Three-point lighting: dominant front key, softer opposite fill, rear rim.
// Camera-relative placement keeps both comparisons under identical illumination.
for(const view of views){view.lights=[new THREE.DirectionalLight(0xfff1df,3),new THREE.DirectionalLight(0xe4efff,1.3),new THREE.DirectionalLight(0xffffff,2)];const key=view.lights[0];key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.bias=-.0002;for(const light of view.lights)view.scene.add(light,light.target);}
let assets=[],filtered=[],selected=null,serial=0,radius=1,stageSize=1;
const bounds=new THREE.Box3();
function clearViews(){for(const v of views){for(const key of ['model','grid','ground'])if(v[key]){v.scene.remove(v[key]);dispose(v[key]);v[key]=null;}}}
function updateLights(){const forward=camera.position.clone().sub(controls.target).setY(0).normalize();if(forward.lengthSq()<.01)forward.set(0,0,1);const right=new THREE.Vector3(forward.z,0,-forward.x);const offsets=[[-2,3,2],[2,1.5,1.5],[1,2.5,-2]];for(const v of views)v.lights.forEach((light,i)=>{const [x,y,z]=offsets[i];light.position.copy(controls.target).addScaledVector(right,x*stageSize).addScaledVector(forward,z*stageSize);light.position.y+=y*stageSize;light.target.position.copy(controls.target);});}
const loader=new GLTFLoader();
function assetURL(a){const url=new URL(collections[a.collection].folder+a.glb,base);url.searchParams.set('v',(a.source_geometry_sha256||'argon-5df1443fd226a5fd').slice(0,16));return url.href;}
function dispose(root){const geometries=new Set(),materials=new Set();root.traverse(o=>{if(o.geometry)geometries.add(o.geometry);if(o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>materials.add(m));});geometries.forEach(g=>g.dispose());materials.forEach(m=>m.dispose());}
function frame(){if(bounds.isEmpty())return;const center=bounds.getCenter(new THREE.Vector3());radius=Math.max(bounds.getSize(new THREE.Vector3()).length()/2,.025);const limiting=Math.min(camera.fov*Math.PI/180,2*Math.atan(Math.tan(camera.fov*Math.PI/360)*camera.aspect));const distance=radius/Math.sin(limiting/2)*1.25;controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(1,.7,1.2).normalize().multiplyScalar(distance));camera.near=radius/1000;camera.far=distance*100;camera.updateProjectionMatrix();controls.minDistance=radius*.15;controls.maxDistance=distance*12;controls.update();}
function stage(){bounds.makeEmpty();for(const v of views)if(v.model)bounds.union(new THREE.Box3().setFromObject(v.model));const s=bounds.getSize(new THREE.Vector3()),size=stageSize=Math.max(s.x,s.y,s.z,.05);const step=10**Math.floor(Math.log10(size/3)),span=Math.ceil(size*5/step)*step;for(const v of views){if(!v.model)continue;v.grid=new THREE.GridHelper(span,Math.min(200,Math.round(span/step)),0x697b80,0x819497);v.grid.material.transparent=true;v.grid.material.opacity=.45;v.grid.position.y=-size*.0003;v.scene.add(v.grid);v.ground=new THREE.Mesh(new THREE.PlaneGeometry(span,span),new THREE.ShadowMaterial({opacity:.24}));v.ground.rotation.x=-Math.PI/2;v.ground.position.y=-size*.001;v.ground.receiveShadow=true;v.scene.add(v.ground);const key=v.lights[0];Object.assign(key.shadow.camera,{left:-size*2,right:size*2,top:size*2,bottom:-size*2,near:size*.01,far:size*12});key.shadow.normalBias=size*.002;key.shadow.camera.updateProjectionMatrix();}}
function pager(){const i=filtered.findIndex(a=>a.name===selected?.name);$('position').textContent=filtered.length?`${i<0?'—':i+1} / ${filtered.length}`:'0 / 0';$('prev').disabled=!filtered.length||i===0;$('next').disabled=!filtered.length||i===filtered.length-1;}
function highlight(){document.querySelectorAll('.item').forEach(b=>b.setAttribute('aria-current',String(b.dataset.name===selected?.name)));pager();}
async function select(a){selected=a;const request=++serial,comparison=activeCollection==='vs';highlight();raw('title',label(a));if(comparison)tx('meta','matched');else tx('meta','stats',a);for(const id of ['download','download-astra','download-argon'])$(id).hidden=true;for(const id of ['stats-astra','stats-argon'])raw(id,'');tx('status','loadingObject');clearViews();bounds.makeEmpty();const entries=comparison?[a,a.pair]:[a];const results=await Promise.allSettled(entries.map(item=>loader.loadAsync(assetURL(item))));if(request!==serial||results.some(r=>r.status==='rejected')){for(const r of results)if(r.status==='fulfilled')dispose(r.value.scene);if(request===serial){tx('status','objectFail');for(const r of results)if(r.status==='rejected')console.error(r.reason);}return;}results.forEach((r,i)=>{const v=views[i];v.model=r.value.scene;v.model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=false;}});v.scene.add(v.model);});stage();frame();raw('status','');if(comparison){entries.forEach(item=>{tx('stats-'+item.collection,'stats',item);const link=$('download-'+item.collection);link.href=assetURL(item);link.hidden=false;});}else{$('download').href=assetURL(a);$('download').hidden=false;}history.replaceState(null,'','#'+activeCollection+'/'+a.name);}
const opened=new Set();
function list(){const query=$('search').value.trim().toLowerCase();filtered=assets.filter(a=>`${label(a)} ${groupName(group(a))} ${a.category}`.toLowerCase().includes(query));tx('count','count',filtered.length,assets.length);$('list').replaceChildren();const groups=new Map();filtered.forEach(a=>{const g=group(a);if(!groups.has(g))groups.set(g,[]);groups.get(g).push(a);});groups.forEach((items,name)=>{const d=document.createElement('details');d.open=!!query||opened.has(name);const summary=document.createElement('summary');summary.append(document.createTextNode(groupName(name)));const count=document.createElement('small');count.textContent=items.length;summary.append(count);d.append(summary);d.addEventListener('toggle',()=>{if(!query){if(d.open)opened.add(name);else opened.delete(name);}});items.forEach(a=>{const b=document.createElement('button');b.className='item';b.textContent=label(a);b.dataset.name=a.name;b.onclick=()=>select(a);d.append(b);});$('list').append(d);});if(!filtered.length){const p=document.createElement('p');p.id='empty';p.textContent=t('empty');$('list').append(p);}highlight();}
$('search').addEventListener('input',list);refreshList=()=>{if(assets.length)list();};$('reset').onclick=frame;
function move(delta){const i=filtered.findIndex(a=>a.name===selected?.name),a=filtered[i<0?0:i+delta];if(a){opened.add(group(a));list();select(a);document.querySelector('.item[aria-current=true]')?.scrollIntoView({block:'nearest'});}}
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);
function resize(){const r=$('viewport').getBoundingClientRect();camera.aspect=(activeCollection==='vs'?r.width/2:r.width)/r.height;camera.updateProjectionMatrix();renderer.setSize(r.width,r.height);}
new ResizeObserver(resize).observe($('viewport'));
renderer.setAnimationLoop(()=>{controls.update();updateLights();const {width,height}=$('viewport').getBoundingClientRect();renderer.setScissorTest(false);renderer.setViewport(0,0,width,height);renderer.clear();if(activeCollection==='vs'){renderer.setScissorTest(true);const half=Math.floor(width/2);views.forEach((v,i)=>{const x=i?half:0,w=i?width-half:half;renderer.setViewport(x,0,w,height);renderer.setScissor(x,0,w,height);renderer.render(v.scene,camera);});renderer.setScissorTest(false);}else renderer.render(views[0].scene,camera);});
async function getManifest(key){if(!manifests.has(key)){const response=await fetch(new URL(collections[key].folder+'manifest.json',base),{cache:'no-store'});if(!response.ok)throw new Error('Manifest unavailable');const data=await response.json();const rows=data.assets||data.items;if(!Array.isArray(rows)||!rows.length)throw new Error('Empty collection');manifests.set(key,rows.map(a=>({...a,name:a.name||a.id,glb:a.glb||a.glb_path,export_vertices:a.export_vertices??a.glb_vertices,collection:key})).sort((a,b)=>a.name.localeCompare(b.name)));}return manifests.get(key);}
async function switchCollection(key,preferred=selected?.name){
if(!collections[key])key='astra';
const request=++collectionSerial;++serial;activeCollection=key;assets=[];filtered=[];selected=null;
clearViews();bounds.makeEmpty();$('comparison').classList.toggle('visible',key==='vs');resize();
$('download').hidden=true;raw('title',collections[key].label);raw('meta','');tx('status','loadingCollection');tx('count','loadingCollection');$('list').replaceChildren();pager();
for(const button of document.querySelectorAll('[data-collection]')){const current=button.dataset.collection===key;button.setAttribute('aria-selected',String(current));button.tabIndex=current?0:-1;}
$('collection-panel').setAttribute('aria-labelledby','tab-'+key);
try{
let rows;if(key==='vs'){const [astra,argon]=await Promise.all([getManifest('astra'),getManifest('argon')]);const counterparts=new Map(argon.map(a=>[a.name,a]));rows=astra.filter(a=>counterparts.has(a.name)).map(a=>({...a,pair:counterparts.get(a.name)}));}else rows=await getManifest(key);
if(request!==collectionSerial)return;
assets=rows;list();const initial=filtered.find(a=>a.name===preferred)||filtered[0];
if(initial){opened.add(group(initial));list();await select(initial);}else{tx('status','noneInCollection');history.replaceState(null,'','#'+key);}
}catch(error){if(request===collectionSerial){tx('status','collectionFail',collections[key].label);tx('count','unavailable');}console.error(error);}
}
for(const button of document.querySelectorAll('[data-collection]')){
button.onclick=()=>switchCollection(button.dataset.collection);
button.onkeydown=event=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();const key=event.key==='Home'?'astra':event.key==='End'?'argon':['astra','vs','argon'][(['astra','vs','argon'].indexOf(activeCollection)+(event.key==='ArrowRight'?1:2))%3];$('tab-'+key).focus();switchCollection(key);}};
}
const hash=decodeURIComponent(location.hash.slice(1));const pieces=hash.split('/');const initialCollection=collections[pieces[0]]?pieces[0]:'astra';
await switchCollection(initialCollection,collections[pieces[0]]?pieces[1]:hash);
}catch(error){console.error(error);tx('status','startFail');}
</script>
