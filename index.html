<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>American City — 3D Asset Browser</title>
<style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;color:#ebe8e1;background:#202527}*{box-sizing:border-box}body{margin:0;display:grid;grid-template-columns:310px 1fr;height:100dvh;overflow:hidden}button,input,a{font:inherit}button,a{color:inherit}button{cursor:pointer}aside{background:#24292b;border-right:1px solid #424849;display:flex;flex-direction:column;min-height:0}header{padding:24px 20px 16px}h1{font-size:18px;margin:0 0 5px;letter-spacing:-.4px}.sub{font-size:12px;color:#aab2b2}input{width:100%;margin-top:20px;padding:12px;background:#191e20;color:#eee;border:1px solid #485154;border-radius:7px;outline:none}input:focus{border-color:#d7bd87}#count{margin-top:10px}nav{overflow:auto;padding:0 10px 20px;flex:1}details{margin:3px 0}summary{cursor:pointer;padding:12px 9px;font-weight:600;font-size:13px;color:#c9cfcd}summary small{float:right;color:#8e999b;font-weight:400}.item{display:block;text-align:left;width:calc(100% - 22px);margin-left:22px;padding:9px 10px;border:0;border-left:1px solid #424b4c;background:none;color:#aeb9bb;font-size:12px;line-height:1.4}.item:hover{background:#303a3c;color:#fff}.item[aria-current=true]{border-left:2px solid #d7bd87;background:#3a413e;color:#f2dfb7}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid #d7bd87;outline-offset:-2px}main{position:relative;min-width:0;background:linear-gradient(#39474f 0%,#78878b 62%,#b7b9b1 100%)}#viewport{position:absolute;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.top{position:absolute;top:25px;left:28px;right:28px;pointer-events:none;display:flex;justify-content:space-between;gap:18px}h2{font-size:23px;letter-spacing:-.5px;font-weight:500;margin:0 0 8px;text-shadow:0 1px 12px #0008}#meta{font-size:12px;color:#d2dcdd}.actions{display:flex;gap:8px;align-items:flex-start;pointer-events:auto}.actions button,.actions a{background:#263135d9;border:1px solid #657174;border-radius:6px;padding:9px 12px;text-decoration:none;white-space:nowrap}.bottom{position:absolute;bottom:22px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:center;gap:12px;color:#263135;font-size:12px}.pager{display:flex;align-items:center;gap:10px}.pager button{background:#e1e5dfb8;border:1px solid #87928e;border-radius:5px;padding:8px 13px;color:#263135}.pager button:disabled{opacity:.4;cursor:default}#status{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:15px 22px;background:#20292ee6;border-radius:8px;max-width:90%;text-align:center}#status:empty{display:none}#empty{padding:18px;color:#adb7b9}a[hidden]{display:none}@media(max-width:760px){body{grid-template-columns:220px 1fr}.top{left:16px;right:16px;top:18px;display:block}h2{font-size:18px}.actions{margin-top:14px}.bottom{left:16px;right:16px;flex-wrap:wrap}.hint{display:none}}@media(max-width:480px){body{grid-template-columns:165px 1fr}header{padding:18px 12px}h1{font-size:15px}summary{font-size:12px}.item{margin-left:10px;width:calc(100% - 10px)}.actions{flex-wrap:wrap}.actions a,.actions button{padding:7px}#meta{line-height:1.6}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<aside><header><h1>American City</h1><div class="sub">Low-poly object collection</div><input id="search" type="search" placeholder="Search all objects…" aria-label="Search all objects" autocomplete="off"><div class="sub" id="count">Loading collection…</div></header><nav id="list" aria-label="Asset categories"></nav></aside>
<main><div id="viewport"></div><div class="top"><div><h2 id="title">Choose an object</h2><div id="meta"></div></div><div class="actions"><button id="reset" title="Frame the selected object">Reset view</button><a id="download" hidden download>Download GLB</a></div></div><div id="status" role="status" aria-live="polite">Loading 3D viewer…</div><div class="bottom"><span class="hint">Drag to rotate · Right-drag to pan · Scroll to zoom</span><div class="pager"><button id="prev" aria-label="Previous object">←</button><span id="position"></span><button id="next" aria-label="Next object">→</button></div></div></main>
<script type="module">
const $=id=>document.getElementById(id);
try {
const THREE=await import('three');
const {OrbitControls}=await import('three/addons/controls/OrbitControls.js');
const {GLTFLoader}=await import('three/addons/loaders/GLTFLoader.js');
const base=location.protocol==='file:'?'https://raw.githubusercontent.com/RHS059/low_poly_items/main/':new URL('./',location.href).href;
const categories=['Street furniture','Traffic & parking','Cars, bikes & motorcycles','Waste & cleaning','Utilities & HVAC','Tools','Construction','Plants & landscaping','Playgrounds & sports','Storefronts & food service','Yards & gardens','Building exteriors','Roads & transit','Mail & logistics','Commercial & emergency vehicles','Food, packaging & litter','Personal & recreation','Lighting & civic fixtures','Fences & gates','Waterfront, winter & events','Modular building kit'];
const label=a=>a.name.replace(/^b\d+_/,'').replaceAll('_',' ');
const group=a=>categories[Number(a.name.slice(1,3))-1]||a.category;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(38,1,.001,1000);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0,0);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
$('viewport').append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.49;
// Exactly one light; no ambient light or environment illumination.
const light=new THREE.DirectionalLight(0xfff1d6,4);light.castShadow=true;light.shadow.mapSize.set(2048,2048);light.shadow.bias=-0.0002;light.shadow.normalBias=.015;scene.add(light,light.target);
let grid=null,ground=null,model=null,assets=[],filtered=[],selected=null,serial=0,radius=1;
const loader=new GLTFLoader();
function dispose(root){const geometries=new Set(),materials=new Set();root.traverse(o=>{if(o.geometry)geometries.add(o.geometry);if(o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>materials.add(m));});geometries.forEach(g=>g.dispose());materials.forEach(m=>m.dispose());}
function frame(){if(!model)return;const box=new THREE.Box3().setFromObject(model),center=box.getCenter(new THREE.Vector3());radius=Math.max(box.getSize(new THREE.Vector3()).length()/2,.025);const limiting=Math.min(camera.fov*Math.PI/180,2*Math.atan(Math.tan(camera.fov*Math.PI/360)*camera.aspect));const distance=radius/Math.sin(limiting/2)*1.25;controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(1,.7,1.2).normalize().multiplyScalar(distance));camera.near=radius/1000;camera.far=distance*100;camera.updateProjectionMatrix();controls.minDistance=radius*.15;controls.maxDistance=distance*12;controls.update();}
function stage(){if(grid){scene.remove(grid,ground);dispose(grid);dispose(ground);}const box=new THREE.Box3().setFromObject(model),s=box.getSize(new THREE.Vector3()),size=Math.max(s.x,s.y,s.z,.05);const step=10**Math.floor(Math.log10(size/3));const span=Math.ceil(size*5/step)*step;grid=new THREE.GridHelper(span,Math.min(200,Math.round(span/step)),0x697b80,0x819497);grid.material.transparent=true;grid.material.opacity=.45;grid.position.y=-size*.0003;scene.add(grid);ground=new THREE.Mesh(new THREE.PlaneGeometry(span,span),new THREE.ShadowMaterial({opacity:.24}));ground.rotation.x=-Math.PI/2;ground.position.y=-size*.001;ground.receiveShadow=true;scene.add(ground);light.position.set(size*2,size*3,size*2);light.target.position.set(0,s.y/2,0);Object.assign(light.shadow.camera,{left:-size*2,right:size*2,top:size*2,bottom:-size*2,near:size*.01,far:size*12});light.shadow.normalBias=size*.002;light.shadow.camera.updateProjectionMatrix();}
function pager(){const i=filtered.findIndex(a=>a.name===selected?.name);$('position').textContent=filtered.length?`${i<0?'—':i+1} / ${filtered.length}`:'0 / 0';$('prev').disabled=!filtered.length||i===0;$('next').disabled=!filtered.length||i===filtered.length-1;}
function highlight(){document.querySelectorAll('.item').forEach(b=>b.setAttribute('aria-current',String(b.dataset.name===selected?.name)));pager();}
async function select(a){selected=a;const request=++serial;highlight();$('title').textContent=label(a);$('meta').textContent=`${a.export_vertices.toLocaleString()} vertices · ${a.triangles.toLocaleString()} triangles · ${a.dimensions_m.map(n=>n.toFixed(2)).join(' × ')} m`;$('download').hidden=true;$('status').textContent='Loading object…';if(model){scene.remove(model);dispose(model);model=null;}try{const gltf=await loader.loadAsync(new URL(a.glb,base).href);if(request!==serial){dispose(gltf.scene);return;}model=gltf.scene;model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=false;}});scene.add(model);stage();frame();$('status').textContent='';$('download').href=new URL(a.glb,base).href;$('download').hidden=false;history.replaceState(null,'','#'+a.name);}catch(e){if(request===serial)$('status').textContent='Could not load this object. Select it again to retry.';console.error(e);}}
const opened=new Set();
function list(){const query=$('search').value.trim().toLowerCase();filtered=assets.filter(a=>`${label(a)} ${group(a)} ${a.category}`.toLowerCase().includes(query));$('count').textContent=`${filtered.length.toLocaleString()} of ${assets.length.toLocaleString()} objects`;$('list').replaceChildren();const groups=new Map();filtered.forEach(a=>{const g=group(a);if(!groups.has(g))groups.set(g,[]);groups.get(g).push(a);});groups.forEach((items,name)=>{const d=document.createElement('details');d.open=!!query||opened.has(name);const summary=document.createElement('summary');summary.append(document.createTextNode(name));const count=document.createElement('small');count.textContent=items.length;summary.append(count);d.append(summary);d.addEventListener('toggle',()=>{if(!query){if(d.open)opened.add(name);else opened.delete(name);}});items.forEach(a=>{const b=document.createElement('button');b.className='item';b.textContent=label(a);b.dataset.name=a.name;b.onclick=()=>select(a);d.append(b);});$('list').append(d);});if(!filtered.length){const p=document.createElement('p');p.id='empty';p.textContent='No matching objects.';$('list').append(p);}highlight();}
$('search').addEventListener('input',list);$('reset').onclick=frame;
function move(delta){const i=filtered.findIndex(a=>a.name===selected?.name),a=filtered[i<0?0:i+delta];if(a){opened.add(group(a));list();select(a);document.querySelector('.item[aria-current=true]')?.scrollIntoView({block:'nearest'});}}
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);
new ResizeObserver(()=>{const r=$('viewport').getBoundingClientRect();camera.aspect=r.width/r.height;camera.updateProjectionMatrix();renderer.setSize(r.width,r.height);}).observe($('viewport'));
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
const response=await fetch(new URL('manifest.json',base));if(!response.ok)throw new Error('Manifest unavailable');assets=(await response.json()).assets;const initial=assets.find(a=>a.name===location.hash.slice(1))||assets[0];opened.add(group(initial));list();await select(initial);
}catch(error){console.error(error);$('status').textContent='The viewer could not start. Check your internet connection and WebGL support, then reload.';}
</script>
</body></html>
